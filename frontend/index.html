<!doctype html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Haras Prime | Catálogo</title><link rel="stylesheet" href="style.css"></head>
<body><header><a class="logo" href=".">HARAS <strong>PRIME</strong></a><span>Catálogo de cavalos</span><button id="cadastrar" type="button">Cadastrar participante</button></header><main><section class="hero"><p>LEILÃO DE CAVALOS</p><h1>Encontre seu próximo campeão.</h1><span>Todo o cadastro e controle do leilão funciona por esta página.</span></section><section id="cadastro" class="cadastro" hidden><h2>Novo participante</h2><form id="form-cadastro"><input name="nome" maxlength="120" placeholder="Nome completo" required><input name="cpf" maxlength="14" placeholder="CPF (11 dígitos)" required><button type="submit">Salvar participante</button><button id="cancelar" type="button">Cancelar</button></form><p id="mensagem" aria-live="polite"></p></section><section><div class="heading"><h2>Cavalos disponíveis</h2><input id="busca" placeholder="Pesquisar por nome"></div><div id="catalogo" class="grid"></div></section><aside>Use os botões dos cards para dar lance, consultar histórico, encerrar ou reabrir um leilão.</aside></main><script src="script.js"></script></body></html>
